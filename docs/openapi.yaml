openapi: 3.0.3
info:
  title: Azimuth API
  description: |
    REST API для платформы Azimuth — анализ и сравнение стран для выбора места проживания.
    
    ## Архитектура
    - **База данных**: PostgreSQL на Fly.io (основное хранилище)
    - **Клиент**: Android приложение с локальной БД Room для офлайн-режима
    - **Аутентификация**: JWT токены для защищённых эндпоинтов
    - **Внешние API**: World Bank, Currents API, Frankfurter
    
    ## Endpoints
    - **Публичные** (без авторизации): страны, метрики, рекомендации
    - **Защищённые** (требуют JWT): пользовательские данные, избранное
    
    ## Оффлайн-режим
    Мобильное приложение хранит базовые данные (страны, флаги, столицы) локально в Room.
    При отсутствии интернета доступны избранные страны и пользовательские настройки.
    Детальная информация (метрики, новости, экономика) требует интернет-соединения.
  version: 1.0.0
  contact:
    name: Azimuth Team
    email: support@azimuth.app

servers:
  - url: https://azimuth-api.fly.dev/api/v1
    description: Production (Fly.io)
  - url: http://localhost:8000/api/v1
    description: Local development

tags:
  - name: Countries
    description: Публичные эндпоинты для работы со странами
  - name: Recommendations
    description: Персональные рекомендации на основе предпочтений
  - name: Auth
    description: Регистрация и аутентификация
  - name: User
    description: Пользовательские данные (защищённые)

paths:
  /countries:
    get:
      tags:
        - Countries
      summary: Получить список стран
      description: Возвращает список всех стран с базовой информацией и актуальными метриками. Поддерживает пагинацию.
      parameters:
        - name: page
          in: query
          description: Номер страницы (начинается с 1)
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Количество стран на странице
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: region
          in: query
          description: Фильтр по региону
          schema:
            type: string
            enum: [Europe, Asia, Americas, Africa, Oceania]
        - name: sort_by
          in: query
          description: Поле для сортировки
          schema:
            type: string
            enum: [name, cost_of_living, safety, healthcare, quality_of_life]
            default: name
        - name: order
          in: query
          description: Порядок сортировки
          schema:
            type: string
            enum: [asc, desc]
            default: asc
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountryListResponse'
              example:
                countries:
                  - id: 1
                    name: Germany
                    code: DE
                    capital: Berlin
                    region: Europe
                    flag_url: https://flagsapi.com/DE.png
                    metrics:
                      cost_of_living: 65.4
                      safety: 58.2
                      healthcare: 76.8
                      quality_of_life: 85.3
                total: 88
                page: 1
                limit: 20
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /countries/{id}:
    get:
      tags:
        - Countries
      summary: Получить детальную информацию о стране
      description: Возвращает полную информацию о стране, включая все метрики, экономические показатели и новости.
      parameters:
        - name: id
          in: path
          required: true
          description: ID страны
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountryDetailResponse'
              example:
                id: 1
                name: Germany
                code: DE
                capital: Berlin
                region: Europe
                flag_url: https://flagsapi.com/DE.png
                latitude: 52.5200
                longitude: 13.4050
                metrics:
                  cost_of_living: 65.4
                  rent_index: 42.3
                  safety: 58.2
                  healthcare: 76.8
                  pollution: 35.6
                  quality_of_life: 85.3
                  climate: 72.1
                  purchasing_power: 98.5
                  property_price_to_income: 12.4
                  visa_score: 173
                  internet_speed: 45.2
                economic_indicators:
                  - year: 2024
                    gdp_per_capita: 48690
                    inflation: 2.1
                    unemployment: 3.4
                  - year: 2023
                    gdp_per_capita: 47520
                    inflation: 1.9
                    unemployment: 3.2
                news:
                  - title: Germany economy grows 2.5% in Q4
                    description: Economic growth exceeds expectations...
                    url: https://news.com/germany-economy
                    published_at: 2026-11-08T10:30:00Z
                    source: Reuters
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /recommend:
    post:
      tags:
        - Recommendations
      summary: Получить персональные рекомендации
      description: |
        Возвращает рейтинг стран на основе пользовательских предпочтений.
        Использует RecSys engine с geometric mean и учётом температуры.
        
        **Алгоритм:**
        1. Нормализация метрик (0-100)
        2. Расчёт весов из приоритетов (γ=1.3)
        3. Geometric mean для core score
        4. Учёт температуры (если enabled)
        5. Ранжирование и возврат топ-10
        
        **Оффлайн:** Этот эндпоинт требует интернет-соединения.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendationRequest'
            example:
              preferences:
                - metric: safety
                  priority: 8
                  enabled: true
                - metric: cost_of_living
                  priority: 5
                  enabled: true
                - metric: healthcare
                  priority: 7
                  enabled: true
              temperature_preference:
                target: 20
                enabled: true
              top_n: 10
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationResponse'
              example:
                recommendations:
                  - country_id: 15
                    name: Portugal
                    score: 87.5
                    breakdown:
                      safety: 8.2
                      cost_of_living: 9.1
                      healthcare: 7.8
                    confidence: 0.92
                  - country_id: 23
                    name: Spain
                    score: 85.2
                    breakdown:
                      safety: 7.9
                      cost_of_living: 8.8
                      healthcare: 8.1
                    confidence: 0.89
                algorithm: geometric_mean
                parameters:
                  gamma: 1.3
                  epsilon: 0.02
                  lambda: 0.08
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/register:
    post:
      tags:
        - Auth
      summary: Регистрация нового пользователя
      description: Создаёт нового пользователя с указанным email и паролем. Возвращает JWT токен.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              email: user@example.com
              password: SecurePass123!
      responses:
        '201':
          description: Пользователь создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              example:
                access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                token_type: bearer
                expires_in: 86400
                user_id: 123
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email уже зарегистрирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: EMAIL_EXISTS
                  message: Email already registered
                  details:
                    field: email
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/login:
    post:
      tags:
        - Auth
      summary: Аутентификация пользователя
      description: Проверяет email и пароль, возвращает JWT токен.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: user@example.com
              password: SecurePass123!
      responses:
        '200':
          description: Успешная аутентификация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              example:
                access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                token_type: bearer
                expires_in: 86400
                user_id: 123
        '401':
          description: Неверные учётные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: INVALID_CREDENTIALS
                  message: Invalid email or password
                  details: null
        '500':
          $ref: '#/components/responses/InternalError'

  /user/preferences:
    get:
      tags:
        - User
      summary: Получить пользовательские предпочтения
      description: Возвращает текущие предпочтения пользователя для рекомендаций.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreferencesResponse'
              example:
                preferences:
                  - metric: safety
                    priority: 8
                    enabled: true
                  - metric: cost_of_living
                    priority: 5
                    enabled: true
                temperature_preference:
                  target: 20
                  enabled: true
                updated_at: 2026-11-08T10:30:00Z
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

    put:
      tags:
        - User
      summary: Обновить пользовательские предпочтения
      description: Сохраняет новые предпочтения пользователя на сервере.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreferencesUpdateRequest'
            example:
              preferences:
                - metric: safety
                  priority: 9
                  enabled: true
                - metric: cost_of_living
                  priority: 6
                  enabled: true
              temperature_preference:
                target: 22
                enabled: true
      responses:
        '200':
          description: Предпочтения обновлены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreferencesResponse'
              example:
                preferences:
                  - metric: safety
                    priority: 9
                    enabled: true
                  - metric: cost_of_living
                    priority: 6
                    enabled: true
                temperature_preference:
                  target: 22
                  enabled: true
                updated_at: 2026-11-08T15:45:00Z
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /user/favorites:
    get:
      tags:
        - User
      summary: Получить список избранных стран
      description: Возвращает все страны, добавленные пользователем в избранное.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteListResponse'
              example:
                favorites:
                  - id: 1
                    name: Germany
                    code: DE
                    capital: Berlin
                    flag_url: https://flagsapi.com/DE.png
                    added_at: 2026-11-08T10:30:00Z
                  - id: 15
                    name: Portugal
                    code: PT
                    capital: Lisbon
                    flag_url: https://flagsapi.com/PT.png
                    added_at: 2026-11-07T14:20:00Z
                total: 2
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /user/favorites/{country_id}:
    post:
      tags:
        - User
      summary: Добавить страну в избранное
      description: Добавляет указанную страну в список избранных пользователя.
      security:
        - bearerAuth: []
      parameters:
        - name: country_id
          in: path
          required: true
          description: ID страны
          schema:
            type: integer
            example: 15
      responses:
        '200':
          description: Страна добавлена в избранное
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteResponse'
              example:
                message: Country added to favorites
                country_id: 15
                added_at: 2026-11-08T16:00:00Z
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Страна уже в избранном
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: ALREADY_FAVORITED
                  message: Country already in favorites
                  details: null
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags:
        - User
      summary: Удалить страну из избранного
      description: Удаляет указанную страну из списка избранных пользователя.
      security:
        - bearerAuth: []
      parameters:
        - name: country_id
          in: path
          required: true
          description: ID страны
          schema:
            type: integer
            example: 15
      responses:
        '200':
          description: Страна удалена из избранного
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteResponse'
              example:
                message: Country removed from favorites
                country_id: 15
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Страна не найдена или не в избранном
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: NOT_IN_FAVORITES
                  message: Country not in favorites
                  details: null
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT токен из /auth/login

  schemas:
    Country:
      type: object
      properties:
        id:
          type: integer
          description: ID страны
        name:
          type: string
          description: Название страны
        code:
          type: string
          description: ISO код страны (2 буквы)
        capital:
          type: string
          description: Столица
        region:
          type: string
          description: Регион
        flag_url:
          type: string
          format: uri
          description: URL флага страны
        latitude:
          type: number
          format: double
          description: Широта
        longitude:
          type: number
          format: double
          description: Долгота
      required:
        - id
        - name
        - code
        - capital
        - region
        - flag_url

    CountryMetrics:
      type: object
      description: Актуальные метрики страны (нормализованные 0-100)
      properties:
        cost_of_living:
          type: number
          format: double
          description: Индекс стоимости жизни (меньше = дешевле)
        rent_index:
          type: number
          format: double
          description: Индекс аренды
        safety:
          type: number
          format: double
          description: Индекс безопасности
        healthcare:
          type: number
          format: double
          description: Индекс здравоохранения
        pollution:
          type: number
          format: double
          description: Индекс загрязнения (меньше = чище)
        quality_of_life:
          type: number
          format: double
          description: Индекс качества жизни
        climate:
          type: number
          format: double
          description: Индекс климата
        purchasing_power:
          type: number
          format: double
          description: Индекс покупательной способности
        property_price_to_income:
          type: number
          format: double
          description: Отношение цены жилья к доходу
        visa_score:
          type: integer
          description: Визовый рейтинг (количество безвизовых стран)
        internet_speed:
          type: number
          format: double
          description: Скорость интернета (Mbps)

    EconomicIndicator:
      type: object
      properties:
        year:
          type: integer
          description: Год
        gdp_per_capita:
          type: number
          format: double
          description: ВВП на душу населения (USD)
        inflation:
          type: number
          format: double
          description: Инфляция (%)
        unemployment:
          type: number
          format: double
          description: Безработица (%)
      required:
        - year
        - gdp_per_capita
        - inflation
        - unemployment

    NewsArticle:
      type: object
      properties:
        title:
          type: string
          description: Заголовок новости
        description:
          type: string
          description: Описание (300 символов)
        url:
          type: string
          format: uri
          description: URL статьи
        published_at:
          type: string
          format: date-time
          description: Дата публикации
        source:
          type: string
          description: Источник новости
      required:
        - title
        - url
        - published_at

    CountryListResponse:
      type: object
      properties:
        countries:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
              code:
                type: string
              capital:
                type: string
              region:
                type: string
              flag_url:
                type: string
                format: uri
              metrics:
                $ref: '#/components/schemas/CountryMetrics'
        total:
          type: integer
          description: Общее количество стран
        page:
          type: integer
          description: Текущая страница
        limit:
          type: integer
          description: Лимит на странице
      required:
        - countries
        - total
        - page
        - limit

    CountryDetailResponse:
      allOf:
        - $ref: '#/components/schemas/Country'
        - type: object
          properties:
            metrics:
              $ref: '#/components/schemas/CountryMetrics'
            economic_indicators:
              type: array
              items:
                $ref: '#/components/schemas/EconomicIndicator'
            news:
              type: array
              items:
                $ref: '#/components/schemas/NewsArticle'

    Preference:
      type: object
      properties:
        metric:
          type: string
          description: Тип метрики
          enum:
            - cost_of_living
            - rent_index
            - safety
            - healthcare
            - pollution
            - quality_of_life
            - climate
            - purchasing_power
            - property_price_to_income
            - visa_score
            - internet_speed
        priority:
          type: integer
          description: Приоритет (1-10)
          minimum: 1
          maximum: 10
        enabled:
          type: boolean
          description: Учитывать ли метрику в расчёте
      required:
        - metric
        - priority
        - enabled

    TemperaturePreference:
      type: object
      properties:
        target:
          type: number
          format: double
          description: Целевая температура (°C)
        enabled:
          type: boolean
          description: Учитывать ли температуру
      required:
        - target
        - enabled

    RecommendationRequest:
      type: object
      properties:
        preferences:
          type: array
          items:
            $ref: '#/components/schemas/Preference'
          description: Список предпочтений пользователя
        temperature_preference:
          $ref: '#/components/schemas/TemperaturePreference'
        top_n:
          type: integer
          description: Количество рекомендуемых стран
          minimum: 1
          maximum: 50
          default: 10
      required:
        - preferences

    RecommendationItem:
      type: object
      properties:
        country_id:
          type: integer
          description: ID страны
        name:
          type: string
          description: Название страны
        score:
          type: number
          format: double
          description: Итоговый рейтинг (0-100)
        breakdown:
          type: object
          additionalProperties:
            type: number
            format: double
          description: Разбивка по метрикам
        confidence:
          type: number
          format: double
          description: Уверенность алгоритма (0-1)
      required:
        - country_id
        - name
        - score

    RecommendationResponse:
      type: object
      properties:
        recommendations:
          type: array
          items:
            $ref: '#/components/schemas/RecommendationItem'
        algorithm:
          type: string
          description: Использованный алгоритм
          enum: [geometric_mean]
        parameters:
          type: object
          properties:
            gamma:
              type: number
              description: Приоритетный коэффициент
            epsilon:
              type: number
              description: Минимальное значение
            lambda:
              type: number
              description: Вес температуры
      required:
        - recommendations

    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          description: Email пользователя
        password:
          type: string
          format: password
          description: Пароль (минимум 8 символов)
          minLength: 8
      required:
        - email
        - password

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          description: Email пользователя
        password:
          type: string
          format: password
          description: Пароль
      required:
        - email
        - password

    AuthResponse:
      type: object
      properties:
        access_token:
          type: string
          description: JWT токен
        token_type:
          type: string
          description: Тип токена
          enum: [bearer]
        expires_in:
          type: integer
          description: Время жизни токена (секунды)
          example: 86400
        user_id:
          type: integer
          description: ID пользователя
      required:
        - access_token
        - token_type
        - expires_in
        - user_id

    PreferencesResponse:
      type: object
      properties:
        preferences:
          type: array
          items:
            $ref: '#/components/schemas/Preference'
        temperature_preference:
          $ref: '#/components/schemas/TemperaturePreference'
        updated_at:
          type: string
          format: date-time
          description: Дата последнего обновления
      required:
        - preferences

    PreferencesUpdateRequest:
      type: object
      properties:
        preferences:
          type: array
          items:
            $ref: '#/components/schemas/Preference'
        temperature_preference:
          $ref: '#/components/schemas/TemperaturePreference'
      required:
        - preferences

    FavoriteResponse:
      type: object
      properties:
        message:
          type: string
          description: Сообщение о результате операции
        country_id:
          type: integer
          description: ID страны
        added_at:
          type: string
          format: date-time
          description: Дата добавления (только для POST)
      required:
        - message
        - country_id

    FavoriteListResponse:
      type: object
      properties:
        favorites:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
              code:
                type: string
              capital:
                type: string
              flag_url:
                type: string
                format: uri
              added_at:
                type: string
                format: date-time
        total:
          type: integer
          description: Общее количество избранных стран
      required:
        - favorites
        - total

    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: Код ошибки
              example: VALIDATION_ERROR
            message:
              type: string
              description: Описание ошибки
              example: Invalid request format
            details:
              type: object
              description: Дополнительные детали
              properties:
                field:
                  type: string
                reason:
                  type: string
          required:
            - code
            - message
      required:
        - error

  responses:
    BadRequest:
      description: Неверный формат запроса
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: VALIDATION_ERROR
              message: Invalid request format
              details:
                field: email
                reason: Invalid email format

    Unauthorized:
      description: Отсутствует или недействителен JWT токен
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: UNAUTHORIZED
              message: Missing or invalid authentication token
              details: null

    NotFound:
      description: Ресурс не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: NOT_FOUND
              message: Country not found
              details: null

    InternalError:
      description: Внутренняя ошибка сервера
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: INTERNAL_ERROR
              message: An unexpected error occurred
              details: null
